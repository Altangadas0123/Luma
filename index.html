<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
  </head>
  <body class="flex flex-col items-center">
    <div class="w-[1440px] h-[2666.77px] bg-[#F7F8F3]">
      <header class="w-full h-[72px] flex items-center px-12 border-b-[1px] border-[#E3E4DF]">
        <div class="w-[119px] h-[41px] flex items-center gap-2">
          <p class="text-4xl">✳</p>
          <p class="w-[75px] h-[41px] font-['Manrope',sans-serif] text-3xl tracking-[-2px]">luma.</p>
        </div>
      </header>

      <div class="w-[1440px] h-[103px] border py-5 px-12 flex items-center gap-12 border-[#DFE2D7]">
        <h1 class="w-[550.08px] h-[51px] font-['Manrope',sans-serif] font-semibold text-[44px] flex gap-2 items-center tracking-[-4.5%]">
          Find your next
          <span class="text-[#7A8C52]">inspiration.</span>
        </h1>

        <div class="w-[745.2px] h-[62px] rounded-2xl border border-[#D8DECC] py-2 pr-2 pl-5 flex items-center gap-3 bg-[#FFFFFF]">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M14.1673 8.75004C14.1673 11.7416 11.7422 14.1667 8.75065 14.1667C5.75911 14.1667 3.33398 11.7416 3.33398 8.75004C3.33398 5.7585 5.75911 3.33337 8.75065 3.33337C11.7422 3.33337 14.1673 5.7585 14.1673 8.75004Z"
              stroke-width="1.41667"
              stroke="#8A927E"
            />
            <path d="M13.334 13.3334L17.5007 17.5" stroke-width="1.41667" stroke-linecap="round" stroke="#8A927E" />
          </svg>

          <p class="w-[559.2px] h-[21px] font-[`DM-Sans`,sans-serif] font-normal text-base text-[#92988A] flex items-center">Search photos…</p>
          <div class="w-[112px] h-11 flex items-center justify-center rounded-xl bg-[#D9F583] font-[`DM-Sans`,sans-serif] font-semibold text-sm text-[#293719]">Search ↗</div>
        </div>
      </div>

      <main class="w-[1440px] h-[2491.77px] pt-6 pr-12 pb-14 pl-12 flex flex-col items-center gap-8">
        <div class="w-[1344px] h-[2337.77px] columns-3 gap-[22px]">
          <img class="w-full h-auto mb-6 break-inside-avoid rounded-2xl" src="97ef380a3c84808c08a7cc2d7ac56f2df5ce6e0e.jpg" alt="">
         
        </div>


        <div class="w-[152px] h-[42px] rounded-[999px] py-3 px-8 bg-[#D9F583] font-[`DM-Sans`,sans-serif] font-semibold text-sm text-[#293719]">Load more ↓</div>
      </main>
    </div>
  </body>
</html>
